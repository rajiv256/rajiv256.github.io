<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description }}">
  <meta name="keywords" content="{{ site.keywords }}">
  <link rel="canonical" href="{{ site.canonical }}">
  <title>{{ site.title }} · {{ site.affiliation }}</title>

  <link rel="icon" media="(prefers-color-scheme: light)" href="{{ site.favicon | relative_url }}" type="image/svg+xml">
  {% if site.favicon_dark %}<link rel="icon" media="(prefers-color-scheme: dark)" href="{{ site.favicon_dark | relative_url }}" type="image/png">{% endif %}
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.8.6/css/academicons.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% include mathjax.html %}
</head>
<body class="homepage">
  <div class="page-shell">
    {% include site-nav.html %}

    <header class="home-hero">
      <div class="home-hero__content">
        <h1>{{ site.title }}</h1>
        <p class="home-hero__role">{{ site.position }} at {{ site.affiliation }}</p>

        <div class="social-links" aria-label="Academic and social profiles">
          <a href="{{ site.google_scholar }}" aria-label="Google Scholar"><i class="ai ai-google-scholar" aria-hidden="true"></i></a>
          <a href="{{ site.cv_link | relative_url }}" aria-label="Curriculum vitae"><i class="ai ai-cv" aria-hidden="true"></i></a>
          <a href="{{ site.github_link }}" aria-label="GitHub"><i class="fab fa-github" aria-hidden="true"></i></a>
          <a href="{{ site.twitter }}" aria-label="X / Twitter"><i class="fab fa-x-twitter" aria-hidden="true"></i></a>
        </div>
      </div>

      {% if site.avatar %}
      <figure class="home-portrait">
        <img src="{{ site.avatar | relative_url }}" alt="Portrait of {{ site.title }}">
      </figure>
      {% endif %}
    </header>

    <main class="home-main">
      {{ content }}
    </main>

    <aside class="closing-note" aria-label="A favorite quotation">
      <span class="closing-note__mark" aria-hidden="true">&ldquo;</span>
      <p>{{ site.qotd }}</p>
    </aside>

    {% include site-footer.html %}
  </div>
</body>
</html>
